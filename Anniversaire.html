<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Journal des anniversaires</title>
  <style>
    :root {
      --blue: #4a90e2;
      --blue-dark: #2f6fb5;
      --blue-light: #eef6ff;
      --grid: #d5dadd;
      --text: #1f2933;
      --muted: #637381;
      --today: #fff7d6;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background: linear-gradient(180deg, #f5f7f8, #ffffff);
    }

    header {
      padding: 24px;
      background: var(--blue);
      color: white;
      box-shadow: 0 3px 12px rgba(0,0,0,.15);
    }

    header h1 {
      margin: 0 0 6px;
      font-size: 28px;
    }

    header p {
      margin: 0;
      opacity: .9;
    }

    main {
      max-width: 1280px;
      margin: 0 auto;
      padding: 22px;
    }

    .toolbar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 12px;
      margin-bottom: 18px;
      align-items: end;
    }

    .card {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 14px;
      box-shadow: 0 4px 16px rgba(15, 23, 42, .07);
    }

    label {
      display: block;
      font-weight: 700;
      font-size: 13px;
      margin-bottom: 6px;
      color: var(--blue-dark);
    }

    input, textarea {
      width: 100%;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      padding: 10px;
      font-size: 11px;
      background: #fff;
    }

    textarea {
      min-height: 86px;
      resize: vertical;
      font-family: Consolas, monospace;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 11px 16px;
      font-weight: 800;
      cursor: pointer;
      background: var(--blue);
      color: white;
      box-shadow: 0 4px 12px rgba(47,111,85,.25);
    }

    button:hover { background: var(--blue-dark); }

    .button-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .secondary { background: #52606d; }
    .secondary:hover { background: #3e4c59; }

    .success-button {
      background: linear-gradient(#7df85d, #149b23);
      border: 3px solid #0c7a19;
      color: white;
      text-shadow: 0 1px 1px rgba(0,0,0,.45);
      box-shadow: inset 0 0 0 2px rgba(255,255,255,.35), 0 5px 10px rgba(0,0,0,.25);
    }

    .table-wrap {
      overflow: auto;
      border: 1px solid var(--grid);
      border-radius: 14px;
      background: white;
      box-shadow: 0 4px 16px rgba(15, 23, 42, .07);
    }

    table {
      border-collapse: collapse;
      width: 100%;
      min-width: 600px;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: var(--blue);
      color: white;
      text-align: left;
      padding: 9px 8px;
      border: 1px solid var(--blue-dark);
      font-size: 11px;
      white-space: nowrap;
    }

    td {
      padding: 7px 8px;
      border: 1px solid var(--grid);
      font-size: 11px;
      white-space: nowrap;
    }

    tr:nth-child(even) td { background: #f8fafc; }
    tr.is-today td { background: var(--today); font-weight: 700; }

    .small {
      font-size: 11px;
      color: var(--muted);
      margin-top: 8px;
      line-height: 1.45;
    }

    .formulas {
      margin-top: 18px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 12px;
    }

    code {
      display: block;
      background: #0f172a;
      color: #e2e8f0;
      padding: 10px;
      border-radius: 10px;
      overflow-x: auto;
      font-size: 11px;
    }

    .notice {
      margin: 12px 0;
      color: var(--blue-dark);
      font-weight: 700;
    }
  </style>
</head>
<body>
  <header>
    <h1>Journal des anniversaires</h1>
    <p>Âge exact à la minute près, prochaine date d’anniversaire.</p>
  </header>

  <main>
    <section class="toolbar">
      <div class="card">
        <label for="todayInput">Date de référence</label>
        <input id="todayInput" type="date" />
      </div>

    </section>

    <section class="table-wrap" style="margin-top:18px">
      <table id="birthdayTable">
        <thead>
          <tr>
            <th>Nom, Prénom</th>
            <th>Prochain anniversaire</th>
            <th>Heure de naissance</th>
            <th>Âge exact</th>
            <th>Temps restant</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <section class="card">
      <textarea id="dataInput" spellcheck="false" style="display:none;"></textarea>
      <div class="button-row" style="margin-top:10px">

      </div>
      <div id="message" class="notice"></div>
	  
      <div class="card">
        <label for="searchInput">Recherche</label>
        <input id="searchInput" type="search" placeholder="Nom, prénom, signe..." oninput="renderTable()" />
      </div>
    </section>

  </main>

  <script>
    // Format : Nom,Prénom,AAAAMMJJ,HH:MM
    // Si l'heure est absente, elle est automatiquement considérée comme 00:00.
    const defaultCsv = `LeCouffe,Clémence,19571209,00:05
Brochu,Yvon,19590719
Rompré,Hugues,19710531
LeCouffe-Desjardins,Adam,19760724,04:51
Tremblay,Isabelle,19780706
LeCouffe-Desjardins,Félix,19780728,05:10
Nouokam Wakam,Carine Flore,19810605
LeCouffe-Desjardins,Marie,19810618,05:00
Brochu-LeCouffe,Gabriel,19900301,10:00
Brochu-LeCouffe,Benjamin,19931116,07:00
Simard,Joanie,19930314
Bruneau,Mathilde,19981007
Rompré,Vincent,19990127
Massicotte,Angélique,20010418,07:26
Bao,Michael-Andrea,20010628
Massicotte,Kamil,20030616,14:20
Desaulniers,Mia,20070531
Espinoza-Desjardins,Alexis,20080903,09:03
Wakam,Moïse,20090410
Desjardins,Charles-Philippe,20091104
Wakam,Anne-Sarah,20151026`;

    let people = [];
    let currentSort = "calendar";

    const fmtDate = new Intl.DateTimeFormat("fr-CA", {
      weekday: "long", year: "numeric", month: "long", day: "numeric"
    });

    function parseYmd(ymd) {
      const clean = String(ymd || "").trim();
      if (!/^\d{8}$/.test(clean)) return null;
      const y = Number(clean.slice(0, 4));
      const m = Number(clean.slice(4, 6));
      const d = Number(clean.slice(6, 8));
      const date = new Date(y, m - 1, d);
      if (date.getFullYear() !== y || date.getMonth() !== m - 1 || date.getDate() !== d) return null;
      return date;
    }

    function parseTime(value) {
      const clean = String(value || "").trim().toUpperCase();
      if (!clean) return { hours: 0, minutes: 0, known: false };

      let match = clean.match(/^(\d{1,2})[:H](\d{2})(?:\s*(AM|PM))?$/);
      if (!match) return { hours: 0, minutes: 0, known: false };

      let hours = Number(match[1]);
      const minutes = Number(match[2]);
      const ampm = match[3] || "";

      if (minutes > 59) return { hours: 0, minutes: 0, known: false };

      if (ampm) {
        if (hours < 0 || hours > 12) return { hours: 0, minutes: 0, known: false };
        if (hours === 0 && ampm === "PM") return { hours: 0, minutes: 0, known: false };
        if (hours === 12) hours = 0;
        if (ampm === "PM") hours += 12;
      } else if (hours > 23) {
        return { hours: 0, minutes: 0, known: false };
      }

      return { hours, minutes, known: true };
    }

    function getReferenceDateTime() {
      const dateValue = document.getElementById("todayInput").value;
      const [y, m, d] = dateValue.split("-").map(Number);
      const now = new Date();
      return new Date(y, m - 1, d, now.getHours(), now.getMinutes(), 0, 0);
    }

    function exactAge(birthDate, reference) {
      let years = reference.getFullYear() - birthDate.getFullYear();
      let months = reference.getMonth() - birthDate.getMonth();
      let days = reference.getDate() - birthDate.getDate();
      let hours = reference.getHours() - birthDate.getHours();
      let minutes = reference.getMinutes() - birthDate.getMinutes();

      if (minutes < 0) {
        hours--;
        minutes += 60;
      }
      if (hours < 0) {
        days--;
        hours += 24;
      }
      if (days < 0) {
        months--;
        const previousMonthLastDay = new Date(reference.getFullYear(), reference.getMonth(), 0).getDate();
        days += previousMonthLastDay;
      }
      if (months < 0) {
        years--;
        months += 12;
      }

      return `${years} ans, ${months} mois, ${days} jours, ${hours} h ${String(minutes).padStart(2, "0")} min`;
    }

    function nextBirthday(birthDate, reference) {
      let next = new Date(
        reference.getFullYear(),
        birthDate.getMonth(),
        birthDate.getDate(),
        birthDate.getHours(),
        birthDate.getMinutes(),
        0, 0
      );

      if (next < reference) {
        next = new Date(
          reference.getFullYear() + 1,
          birthDate.getMonth(),
          birthDate.getDate(),
          birthDate.getHours(),
          birthDate.getMinutes(),
          0, 0
        );
      }
      return next;
    }

    function timeRemaining(from, to) {
      let totalMinutes = Math.max(0, Math.floor((to - from) / 60000));
      const days = Math.floor(totalMinutes / 1440);
      totalMinutes %= 1440;
      const hours = Math.floor(totalMinutes / 60);
      const minutes = totalMinutes % 60;
      return `${days} j, ${hours} h ${String(minutes).padStart(2, "0")} min`;
    }

    function formatBirthTime(person) {
      const hh = String(person.birthDate.getHours()).padStart(2, "0");
      const mm = String(person.birthDate.getMinutes()).padStart(2, "0");
      return person.timeKnown ? `${hh} h ${mm}` : `${hh} h ${mm} (défaut)`;
    }

    function zodiacSign(date) {
      const m = date.getMonth() + 1;
      const d = date.getDate();
      if ((m === 3 && d >= 21) || (m === 4 && d <= 19)) return "Bélier";
      if ((m === 4 && d >= 20) || (m === 5 && d <= 20)) return "Taureau";
      if ((m === 5 && d >= 21) || (m === 6 && d <= 20)) return "Gémeaux";
      if ((m === 6 && d >= 21) || (m === 7 && d <= 22)) return "Cancer";
      if ((m === 7 && d >= 23) || (m === 8 && d <= 22)) return "Lion";
      if ((m === 8 && d >= 23) || (m === 9 && d <= 22)) return "Vierge";
      if ((m === 9 && d >= 23) || (m === 10 && d <= 22)) return "Balance";
      if ((m === 10 && d >= 23) || (m === 11 && d <= 21)) return "Scorpion";
      if ((m === 11 && d >= 22) || (m === 12 && d <= 21)) return "Sagittaire";
      if ((m === 12 && d >= 22) || (m === 1 && d <= 19)) return "Capricorne";
      if ((m === 1 && d >= 20) || (m === 2 && d <= 18)) return "Verseau";
      return "Poissons";
    }

    function chineseSign(year) {
      const signs = ["Rat", "Buffle", "Tigre", "Lapin", "Dragon", "Serpent", "Cheval", "Chèvre", "Singe", "Coq", "Chien", "Cochon"];
      return signs[(year - 4) % 12];
    }

    function parseCsv(text) {
      return text.split(/\r?\n/)
        .map(line => line.trim())
        .filter(Boolean)
        .map(line => {
          const parts = line.split(",");

          let timeRaw = "";
          const possibleTime = parts[parts.length - 1]?.trim() || "";
          if (/^\d{1,2}[:H]\d{2}(?:\s*(?:AM|PM))?$/i.test(possibleTime)) {
            timeRaw = parts.pop().trim();
          }

          const birthRaw = parts.pop()?.trim() || "";
          const firstName = parts.pop()?.trim() || "";
          const lastName = parts.join(",").trim();
          const displayName = `${lastName}, ${firstName}`.replace(/^,\s*/, "");

          const dateOnly = parseYmd(birthRaw);
          if (!dateOnly) return null;

          const parsedTime = parseTime(timeRaw);
          const birthDate = new Date(
            dateOnly.getFullYear(), dateOnly.getMonth(), dateOnly.getDate(),
            parsedTime.hours, parsedTime.minutes, 0, 0
          );

          return { displayName, birthRaw, birthDate, timeKnown: parsedTime.known };
        })
        .filter(p => p && p.displayName && p.birthDate);
    }

    function loadDataFromTextarea() {
      people = parseCsv(document.getElementById("dataInput").value);
      document.getElementById("message").textContent = `${people.length} personne(s) importée(s). Heure inconnue = 00 h 00.`;
      applyCurrentSort();
    }

    function resetDefaultData() {
      document.getElementById("dataInput").value = defaultCsv;
      loadDataFromTextarea();
    }

    // L'anniversaire du jour est prioritaire, quelle que soit l'heure de naissance.
    function isBirthdayToday(birthDate, reference) {
      return birthDate.getMonth() === reference.getMonth() &&
             birthDate.getDate() === reference.getDate();
    }

    function priorityForToday(a, b, reference) {
      return Number(isBirthdayToday(b.birthDate, reference)) -
             Number(isBirthdayToday(a.birthDate, reference));
    }

    function sortByCalendarOrder() {
      currentSort = "calendar";
      const reference = getReferenceDateTime();
      people.sort((a, b) =>
        priorityForToday(a, b, reference) ||
        (a.birthDate.getMonth() - b.birthDate.getMonth()) ||
        (a.birthDate.getDate() - b.birthDate.getDate()) ||
        (a.birthDate.getHours() - b.birthDate.getHours()) ||
        (a.birthDate.getMinutes() - b.birthDate.getMinutes()) ||
        a.displayName.localeCompare(b.displayName, "fr")
      );
      renderTable();
    }

    function sortByUpcomingBirthdays() {
      currentSort = "upcoming";
      const reference = getReferenceDateTime();
      people.sort((a, b) => {
        // Un anniversaire aujourd'hui reste en tête même si son heure est passée.
        const todayPriority = priorityForToday(a, b, reference);
        if (todayPriority) return todayPriority;
        const an = nextBirthday(a.birthDate, reference);
        const bn = nextBirthday(b.birthDate, reference);
        return an - bn || a.displayName.localeCompare(b.displayName, "fr");
      });
      renderTable();
    }

    function applyCurrentSort() {
      if (currentSort === "upcoming") sortByUpcomingBirthdays();
      else sortByCalendarOrder();
    }

    function renderTable() {
      const tbody = document.querySelector("#birthdayTable tbody");
      const reference = getReferenceDateTime();
      const search = document.getElementById("searchInput").value.toLowerCase().trim();
      tbody.innerHTML = "";

      people.forEach(person => {
        const birth = person.birthDate;
        const next = nextBirthday(birth, reference);
        const rowText = `${person.displayName} ${zodiacSign(birth)} ${chineseSign(birth.getFullYear())} ${formatBirthTime(person)}`.toLowerCase();
        if (search && !rowText.includes(search)) return;

        const tr = document.createElement("tr");
        // La surbrillance dépend uniquement du jour et du mois de naissance,
        // jamais de l'heure (même si celle-ci est déjà passée aujourd'hui).
        const sameCalendarDay = isBirthdayToday(birth, reference);
        if (sameCalendarDay) tr.classList.add("is-today");

        const cells = [
          person.displayName,
          fmtDate.format(next),
          formatBirthTime(person),
          exactAge(birth, reference),
          timeRemaining(reference, next)
        ];

        cells.forEach(value => {
          const td = document.createElement("td");
          td.textContent = value;
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });
    }

    document.getElementById("todayInput").addEventListener("change", sortByUpcomingBirthdays);

    const now = new Date();
    const localNow = new Date(now.getTime() - now.getTimezoneOffset() * 60000);
    document.getElementById("todayInput").value = localNow.toISOString().split("T")[0];

    resetDefaultData();
    sortByUpcomingBirthdays();
  </script>
</body>
</html>
